name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build archives
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="skpod_${version}_${os}_${arch}"
            binary="skpod"
            if [[ "$os" == "windows" ]]; then
              binary="skpod.exe"
            fi

            mkdir "$name"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$name/$binary" \
              ./cmd/skpod
            cp LICENSE README.md "$name/"

            if [[ "$os" == "windows" ]]; then
              zip -q -r "dist/${name}.zip" "$name"
            else
              tar -czf "dist/${name}.tar.gz" "$name"
            fi
            rm -rf "$name"
          done

          (cd dist && sha256sum ./* > checksums.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "skpod $GITHUB_REF_NAME" \
            "${release_flags[@]}"
